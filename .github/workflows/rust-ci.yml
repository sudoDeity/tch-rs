name: PyTorch 2.15 compatibility
on:
  # PR commits run only once; the merged main branch is checked separately.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cpu:
    name: CPU smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      LIBTORCH_USE_PYTORCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify runner architecture
        shell: bash
        run: |
          uname -sm
          python -c 'import platform; print(platform.machine())'
          if [ "${{ runner.os }}" = macOS ]; then
            test "$(uname -m)" = arm64
          fi
      - name: Install PyTorch 2.15 RC from test index
        run: |
          python -m pip install --pre --index-url https://download.pytorch.org/whl/test/cpu torch==2.15.0
          python -c 'import torch; assert torch.__version__.split("+")[0] == "2.15.0"; print(torch.__version__)'
      - name: Configure native library loader
        shell: bash
        run: |
          set -euo pipefail
          TORCH_LIB="$(python -c 'import torch; from pathlib import Path; print(Path(torch.__file__).parent / "lib")')"
          echo "LD_LIBRARY_PATH=$TORCH_LIB" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$TORCH_LIB" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$TORCH_LIB" >> "$GITHUB_ENV"
      - name: Compile tch against PyTorch 2.15 without a bypass
        run: cargo check --locked -p tch
      - name: Run PyTorch 2.15 linalg and gradient smoke tests
        run: cargo test --locked --test pytorch_215_smoke -- --nocapture
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
